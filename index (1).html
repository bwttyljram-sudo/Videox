<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Vidox</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c3d52;--bg2:#13293a;--tx:#f4fbff;--mut:#a9c3d4;--cy:#22d3ee;--sk:#38bdf8;--pk:#f472b6;--vi:#a78bfa;--li:#a3e635;--or:#fb923c;--gr:#22e58b;--gr2:#10b981;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;padding:0 14px 96px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
/* ---------- living background ---------- */
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#2a5a78 0%,var(--bg) 45%,var(--bg2) 100%)}
.blob{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.38;will-change:transform;mix-blend-mode:screen}
.b1{background:radial-gradient(circle,var(--cy),transparent 65%);top:-22vmax;right:-18vmax;animation:drift1 18s ease-in-out infinite alternate}
.b2{background:radial-gradient(circle,var(--pk),transparent 65%);bottom:-24vmax;left:-20vmax;animation:drift2 22s ease-in-out infinite alternate}
.b3{background:radial-gradient(circle,var(--vi),transparent 65%);top:30%;left:20%;opacity:.25;animation:drift3 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-18vw,22vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(24vw,-18vh) scale(1.2)}}
@keyframes drift3{to{transform:translate(-22vw,-14vh) scale(.85)}}
.fl{position:absolute;bottom:-14vh;opacity:0;color:#fff;filter:drop-shadow(0 0 8px rgba(34,211,238,.5));animation:rise linear infinite;will-change:transform,opacity}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(-122vh) rotate(var(--r));opacity:0}}
.grain{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:38px 38px;animation:pan 30s linear infinite;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
@keyframes pan{to{background-position:38px 38px}}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:5;padding:14px 0 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 -14px;padding-inline:14px;background:linear-gradient(rgba(19,41,58,.78),rgba(19,41,58,.35) 80%,transparent)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--cy),var(--pk));display:grid;place-items:center;box-shadow:0 0 22px rgba(34,211,238,.55);animation:beat 2.4s ease-in-out infinite}
.logo svg{width:16px;height:16px;fill:#fff;margin-inline-start:2px}
@keyframes beat{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-6deg)}}
h1{margin:0;font-size:25px;font-weight:800;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk),var(--cy));background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:260% 0}}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font-family:inherit;font-size:14px;padding:11px 0;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--mut)}
/* ---------- cards ---------- */
.note{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#d8f4ff;background:linear-gradient(90deg,rgba(34,211,238,.18),rgba(167,139,250,.16));border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:10px 0 16px}
.card{position:relative;border-radius:22px;margin-bottom:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;opacity:0;transform:translateY(22px) scale(.98);animation:in .55s cubic-bezier(.2,.9,.3,1) forwards;transition:transform .18s;will-change:transform}
@keyframes in{to{opacity:1;transform:none}}
.card:active{transform:scale(.985)}
.card.own{border-color:transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,linear-gradient(120deg,var(--li),var(--cy),var(--pk),var(--li)) border-box;border:2px solid transparent;animation:in .55s forwards,ownglow 2.6s ease-in-out infinite}
@keyframes ownglow{0%,100%{box-shadow:0 0 0 0 rgba(163,230,53,.45)}50%{box-shadow:0 0 26px 3px rgba(34,211,238,.4)}}
.cover{position:relative;height:200px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 6s ease}
.card:hover .cover img,.card:active .cover img{transform:scale(1.08)}
.nocover{height:100%;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#2b6d93,#6d4bd1 55%,#e0508f);animation:bgmove 8s ease-in-out infinite alternate;background-size:160% 160%}
@keyframes bgmove{to{background-position:100% 100%}}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(10,22,32,.88))}
.badge{position:absolute;top:10px;inset-inline-start:10px;z-index:2;background:linear-gradient(135deg,var(--or),var(--pk));color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;animation:wob 2s ease-in-out infinite}
.badge.o{background:linear-gradient(135deg,var(--li),var(--gr2));color:#0b2a14}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.06)}}
.ttl{position:absolute;bottom:12px;inset-inline:14px;z-index:2;font-size:19px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.bubble{position:absolute;top:50%;left:50%;z-index:3;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:11px 26px;font:800 16px Tajawal,sans-serif;color:#052e1c;background:linear-gradient(135deg,#6dffb8,var(--gr) 55%,#12d6a0);box-shadow:0 0 0 0 rgba(34,229,139,.7),0 8px 26px rgba(16,185,129,.55);animation:pop 1.7s ease-in-out infinite;overflow:hidden}
.bubble::after,.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%{left:-60%}60%,100%{left:130%}}
@keyframes pop{0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(34,229,139,.65),0 8px 26px rgba(16,185,129,.5)}50%{transform:translate(-50%,-50%) scale(1.09);box-shadow:0 0 0 14px rgba(34,229,139,0),0 8px 30px rgba(16,185,129,.7)}}
.body{padding:12px 14px 14px}
.desc{font-size:13px;color:var(--mut);line-height:1.65;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;font-size:12px}
.chip{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.chip.p{background:linear-gradient(135deg,rgba(251,146,60,.35),rgba(244,114,182,.3));font-weight:800}
.btn{position:relative;overflow:hidden;width:100%;border:0;border-radius:14px;padding:13px;font:700 15px Tajawal,sans-serif;color:#fff;background:linear-gradient(120deg,#3b82f6,var(--vi) 50%,var(--pk));background-size:180% 100%;animation:bgslide 5s ease-in-out infinite alternate;display:flex;align-items:center;justify-content:center;gap:8px}
@keyframes bgslide{to{background-position:100% 0}}
.btn.sec{background:var(--glass);border:1px solid var(--line);animation:none}
.cta{position:fixed;z-index:9;bottom:calc(14px + env(safe-area-inset-bottom));inset-inline:14px;width:auto;border:0;border-radius:16px;padding:15px;font:800 17px Tajawal,sans-serif;color:#052e1c;background:linear-gradient(120deg,#6dffb8,var(--gr),#12d6a0);overflow:hidden;animation:ctap 1.8s ease-in-out infinite;box-shadow:0 10px 30px rgba(16,185,129,.55)}
.cta.open{color:#fff;background:linear-gradient(120deg,var(--cy),var(--vi),var(--pk));box-shadow:0 10px 30px rgba(34,211,238,.45)}
@keyframes ctap{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:9/13;border-radius:14px;overflow:hidden;background:linear-gradient(110deg,rgba(255,255,255,.08) 30%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.08) 70%);background-size:220% 100%;animation:sk 1.4s linear infinite,in .5s forwards;opacity:0;border:1px solid var(--line)}
@keyframes sk{to{background-position:-120% 0}}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .play{position:absolute;inset:0;display:grid;place-items:center}
.th .play i{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:grid;place-items:center}
.th .play svg{width:13px;height:13px;fill:#fff;margin-inline-start:2px}
.th .d,.th .s{position:absolute;bottom:5px;background:rgba(0,0,0,.65);border-radius:7px;padding:1px 6px;font-size:10.5px}
.th .d{left:5px}.th .s{right:5px}
.hint{text-align:center;color:var(--mut);font-size:12.5px;margin:4px 0 12px}
.sk{height:300px;border-radius:22px;margin-bottom:18px;background:linear-gradient(110deg,rgba(255,255,255,.06) 30%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.06) 70%);background-size:220% 100%;animation:sk 1.4s linear infinite}
.empty{text-align:center;color:var(--mut);padding:44px 10px;line-height:1.9}
.empty b{display:block;font-size:42px;margin-bottom:6px}
.empty .btn{width:auto;display:inline-flex;padding:10px 22px;margin-top:12px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(15,35,50,.92);border:1px solid var(--line);backdrop-filter:blur(10px);padding:11px 18px;border-radius:14px;z-index:30;font-size:13.5px;animation:in .3s forwards}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div><div id="fl"></div></div>
<header>
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div><h1 id="brand">Vidox</h1></div>
  <div class="search" id="sbox"><span>🔎</span><input id="q" type="search" autocomplete="off"></div>
</header>
<div id="app"><div class="sk"></div><div class="sk"></div></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#1c3d52');tg.setBackgroundColor('#1c3d52')}catch(e){}}
const INIT=tg?tg.initData:'';let ST={lang:'ar',channels:[]};
const T={ar:{search:'ابحث عن قناة...',note:'💾 المحتوى مفتوح للحفظ والتحويل · لا استرداد بعد الشراء',buy:'اشترِ الآن',content:'🎞 استعرض المحتوى',open:'فتح القناة',members:'عضو',items:'محتوى',empty:'لا توجد قنوات حالياً',nores:'لا نتائج',preparing:'رابط الدفع قيد التجهيز، حاول بعد قليل.',err:'تعذر التحميل',retry:'إعادة المحاولة',noitems:'لم يُضف محتوى للمعاينة بعد',trust:'🛡 دليل الثقة',free:'مجانية',paid:'تم الدفع ✅ سيصلك رابط الدخول في البوت خلال ثوانٍ',cancel:'أُلغي الدفع',fail:'فشل الدفع',own:'✓ تملكها',hot:'🔥 رائجة',frombot:'افتح التطبيق من داخل البوت',gal:'معاينة المحتوى · للعرض فقط',tap:'اضغط لفتح القناة'},
en:{search:'Search channels...',note:'💾 Content is open to save · no refunds after purchase',buy:'Buy now',content:'🎞 Browse content',open:'Open channel',members:'members',items:'items',empty:'No channels yet',nores:'No results',preparing:'Payment link is being prepared, try again shortly.',err:'Failed to load',retry:'Retry',noitems:'No preview content yet',trust:'🛡 Trust proof',free:'Free',paid:'Paid ✅ your join link is on its way in the bot',cancel:'Payment cancelled',fail:'Payment failed',own:'✓ Owned',hot:'🔥 Trending',frombot:'Open the app from inside the bot',gal:'Content preview · view only',tap:'Tap to open the channel'}};
const tr=k=>(T[ST.lang]||T.ar)[k];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hap=(t='light')=>{try{tg.HapticFeedback.impactOccurred(t)}catch(e){}};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
async function api(p,b={}){try{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:INIT,...b})});return await r.json()}catch(e){return{ok:false,error:'network'}}}
const fdur=s=>{s=+s||0;const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const fsize=n=>{n=+n||0;return n>=1<<30?(n/(1<<30)).toFixed(1)+' GB':n>=1<<20?Math.round(n/(1<<20))+' MB':n?Math.max(1,Math.round(n/1024))+' KB':''};
/* floating video-themed icons over the background */
(function(){const ic=['<svg width="@" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="14" height="12" rx="3"/><path d="M17 10l4-2v8l-4-2z"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h16M4 16h16M9 3v18M15 3v18"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-6 9 6-9 6zM7 13v4c0 1.5 9 1.5 10 0v-4"/></svg>'];
const box=$('#fl');for(let i=0;i<18;i++){const d=document.createElement('div');d.className='fl';const sz=16+Math.random()*30;d.innerHTML=ic[i%ic.length].replace('@',sz|0);d.style.left=(Math.random()*96)+'%';d.style.animationDuration=(14+Math.random()*16)+'s';d.style.animationDelay=(-Math.random()*20)+'s';d.style.setProperty('--o',(.12+Math.random()*.12).toFixed(2));d.style.setProperty('--r',((Math.random()*80-40)|0)+'deg');box.appendChild(d)}})();
/* ripple + haptics on every button */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.cta,.bubble');if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)/2;const s=document.createElement('span');s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),620);hap()});
function openOwned(c){hap('medium');if(c.link){tg.openTelegramLink?tg.openTelegramLink(c.link):window.open(c.link)}}
async function buy(c){hap('medium');if(c.invoice)return pay(c.invoice);const r=await api('buy',{id:c.id});if(r.ok&&r.invoice)return pay(r.invoice);toast(r.error==='preparing'?tr('preparing'):tr('err'))}
function pay(url){tg.openInvoice(url,st=>{if(st==='paid'){hap('heavy');try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}toast(tr('paid'));setTimeout(()=>tg.close(),2600)}else if(st==='cancelled')toast(tr('cancel'));else if(st==='failed')toast(tr('fail'))})}
function fail(code){tg&&tg.BackButton.hide();$('#app').innerHTML=`<div class="empty"><b>${code==='banned'?'🚫':code==='maintenance'?'🛠':'⚠️'}</b>${!INIT?tr('frombot'):tr('err')}<br><small>${esc(code||'')}</small><br><button class="btn" id="rt">${tr('retry')}</button></div>`;$('#rt').onclick=()=>location.reload()}
function card(c,i){return `<div class="card ${c.owned?'own':''}" data-id="${c.id}" style="animation-delay:${Math.min(i,8)*70}ms">
 <div class="cover">${c.cover?`<img loading="lazy" src="/img/c/${c.id}.jpg" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'nocover',textContent:'🎬'}))">`:'<div class="nocover">🎬</div>'}
 ${c.owned?`<span class="badge o">${tr('own')}</span>`:c.hot?`<span class="badge">${tr('hot')}</span>`:''}
 ${c.owned?'':`<button class="bubble" data-buy="${c.id}">${tr('buy')} · ${c.price} ⭐</button>`}
 <div class="ttl">${esc(c.name)}</div></div>
 <div class="body">${c.desc?`<p class="desc">${esc(c.desc)}</p>`:''}
 <div class="meta"><span class="chip">🎞 ${c.count} ${tr('items')}</span><span class="chip">👥 ${c.members} ${tr('members')}</span><span class="chip p">${c.price>0?c.price+' ⭐':tr('free')}</span></div>
 <button class="btn" data-view="${c.id}">${tr('content')}</button></div></div>`}
function renderList(){
  tg&&tg.BackButton.hide();$('#sbox').style.display='';const f=($('#q').value||'').trim().toLowerCase();
  const list=ST.channels.filter(c=>!f||(c.name+' '+c.title).toLowerCase().includes(f));
  const el=$('#app');
  if(!ST.channels.length){el.innerHTML=`<div class="empty"><b>🎬</b>${tr('empty')}</div>`;return}
  el.innerHTML=`<div class="note">${tr('note')}</div>`+(list.length?list.map(card).join(''):`<div class="empty"><b>🔎</b>${tr('nores')}</div>`)+(ST.trust?`<button class="btn sec" id="trust">${tr('trust')}</button>`:'');
  el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=e=>{e.stopPropagation();buy(ST.channels.find(c=>c.id==b.dataset.buy))});
  el.querySelectorAll('[data-view]').forEach(b=>b.onclick=e=>{e.stopPropagation();showChannel(+b.dataset.view)});
  el.querySelectorAll('.card.own').forEach(d=>d.onclick=()=>openOwned(ST.channels.find(c=>c.id==d.dataset.id)));
  const t=$('#trust');if(t)t.onclick=()=>{hap();tg.openTelegramLink(ST.trust)};
  el.querySelectorAll('.card').forEach(d=>{d.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!e.buttons)return;const r=d.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;d.style.transform=`perspective(700px) rotateY(${x*7}deg) rotateX(${-y*7}deg)`});['pointerup','pointerleave','pointercancel'].forEach(n=>d.addEventListener(n,()=>d.style.transform=''))})
}
async function showChannel(id){
  const c=ST.channels.find(x=>x.id==id);if(!c)return;hap();
  tg.BackButton.show();$('#sbox').style.display='none';window.scrollTo({top:0});
  $('#app').innerHTML='<div class="sk" style="height:140px"></div><div class="gal">'+'<div class="th" style="opacity:1"></div>'.repeat(9)+'</div>';
  const r=await api('channel',{id});const m=(r.ok&&r.media)||[];
  $('#app').innerHTML=`<div class="hint">${esc(c.name)} · ${tr('gal')}</div>`+(m.length?`<div class="gal">${m.map((v,i)=>`<div class="th" style="animation-delay:0s,${Math.min(i,12)*40}ms"><img loading="lazy" src="/img/v/${v.id}.jpg" onerror="this.remove()"><div class="play"><i><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></i></div><span class="d">${fdur(v.duration)}</span><span class="s">${fsize(v.size)}</span></div>`).join('')}</div>`:`<div class="empty"><b>🎞</b>${tr('noitems')}</div>`)+
  (c.owned?`<button class="cta open" id="act">${tr('open')}</button>`:`<button class="cta" id="act">${tr('buy')} · ${c.price} ⭐</button>`);
  $('#act').onclick=()=>c.owned?openOwned(c):buy(c)
}
$('#q').addEventListener('input',()=>renderList());
if(tg)tg.BackButton.onClick(()=>{hap();renderList()});
(async()=>{
  if(!INIT){fail('no_init');return}
  const r=await api('init');
  if(!r.ok){fail(r.error);return}
  ST=r;document.documentElement.lang=r.lang;document.documentElement.dir=r.lang==='ar'?'rtl':'ltr';
  if(r.brand){document.title=r.brand;$('#brand').textContent=r.brand}
  $('#q').placeholder=tr('search');renderList();
  const q=new URLSearchParams(location.search).get('c');if(q&&ST.channels.find(c=>c.id==q))showChannel(+q)
})();
