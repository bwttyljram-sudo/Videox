<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Vidox</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c3d52;--bg2:#13293a;--tx:#f4fbff;--mut:#a9c3d4;--cy:#22d3ee;--sk:#38bdf8;--pk:#f472b6;--vi:#a78bfa;--li:#a3e635;--or:#fb923c;--gr:#22e58b;--gr2:#10b981;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;padding:0 14px 96px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#2a5a78 0%,var(--bg) 45%,var(--bg2) 100%);contain:strict}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.3;will-change:transform}
.b1{background:radial-gradient(circle,var(--cy),transparent 62%);top:-30vmax;right:-26vmax;animation:d1 20s ease-in-out infinite alternate}
.b2{background:radial-gradient(circle,var(--pk),transparent 62%);bottom:-32vmax;left:-28vmax;animation:d2 24s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(-16vw,20vh,0)}}
@keyframes d2{to{transform:translate3d(22vw,-16vh,0)}}
.grain{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px}
.fl{position:absolute;bottom:-12vh;opacity:0;color:#fff;animation:rise linear infinite;will-change:transform,opacity}
@keyframes rise{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}12%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translate3d(0,-120vh,0) rotate(var(--r));opacity:0}}
header{position:sticky;top:0;z-index:5;padding:12px 14px 10px;margin:0 -14px;background:linear-gradient(rgba(19,41,58,.92),rgba(19,41,58,.6) 85%,transparent)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--cy),var(--pk));display:grid;place-items:center;box-shadow:0 0 18px rgba(34,211,238,.5)}
.logo svg{width:16px;height:16px;fill:#fff;margin-inline-start:2px}
h1{margin:0;font-size:25px;font-weight:800;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font-family:inherit;font-size:14px;padding:11px 0;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--mut)}
.note{font-size:12.5px;color:#d8f4ff;background:rgba(34,211,238,.14);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:10px 0 16px}
.card{position:relative;border-radius:22px;margin-bottom:18px;background:rgba(21,48,66,.82);border:1px solid var(--line);overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 330px;animation:in .4s ease-out both}
@keyframes in{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
.card:active{opacity:.92}
.card.own{border:2px solid var(--li);box-shadow:0 0 18px rgba(163,230,53,.28)}
.cover{position:relative;height:200px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.nocover{height:100%;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#2b6d93,#6d4bd1 55%,#e0508f)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(10,22,32,.88));pointer-events:none}
.badge{position:absolute;top:10px;inset-inline-start:10px;z-index:2;background:linear-gradient(135deg,var(--or),var(--pk));color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}
.badge.o{background:linear-gradient(135deg,var(--li),var(--gr2));color:#0b2a14}
.ttl{position:absolute;bottom:12px;inset-inline:14px;z-index:2;font-size:19px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.bubble{position:absolute;top:50%;left:50%;z-index:3;margin:0;transform:translate3d(-50%,-50%,0);border:0;border-radius:999px;padding:11px 26px;font:800 16px Tajawal,sans-serif;color:#052e1c;background:linear-gradient(135deg,#6dffb8,var(--gr) 55%,#12d6a0);box-shadow:0 6px 20px rgba(16,185,129,.5);animation:pop 1.8s ease-in-out infinite;will-change:transform}
@keyframes pop{0%,100%{transform:translate3d(-50%,-50%,0) scale(1)}50%{transform:translate3d(-50%,-50%,0) scale(1.08)}}
.body{padding:12px 14px 14px}
.desc{font-size:13px;color:var(--mut);line-height:1.65;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;font-size:12px}
.chip{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.chip.p{background:linear-gradient(135deg,rgba(251,146,60,.35),rgba(244,114,182,.3));font-weight:800}
.btn{position:relative;overflow:hidden;width:100%;border:0;border-radius:14px;padding:13px;font:700 15px Tajawal,sans-serif;color:#fff;background:linear-gradient(120deg,#3b82f6,var(--vi) 50%,var(--pk));display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--glass);border:1px solid var(--line)}
.btn.more{background:var(--glass);border:1px solid var(--line);margin:6px 0 90px}
.cta{position:fixed;z-index:9;bottom:calc(14px + env(safe-area-inset-bottom));inset-inline:14px;width:auto;border:0;border-radius:16px;padding:15px;font:800 17px Tajawal,sans-serif;color:#052e1c;background:linear-gradient(120deg,#6dffb8,var(--gr),#12d6a0);overflow:hidden;animation:ctap 1.9s ease-in-out infinite;box-shadow:0 8px 24px rgba(16,185,129,.5);will-change:transform}
.cta.open{color:#fff;background:linear-gradient(120deg,var(--cy),var(--vi),var(--pk))}
.cta::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translate3d(-150%,0,0) skewX(-20deg);animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%{transform:translate3d(-150%,0,0) skewX(-20deg)}60%,100%{transform:translate3d(350%,0,0) skewX(-20deg)}}
@keyframes ctap{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:9/13;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.1);border:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 160px}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .play{position:absolute;inset:0;display:grid;place-items:center}
.th .play i{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center}
.th .play svg{width:13px;height:13px;fill:#fff;margin-inline-start:2px}
.th .d,.th .s{position:absolute;bottom:5px;background:rgba(0,0,0,.65);border-radius:7px;padding:1px 6px;font-size:10.5px}
.th .d{left:5px}.th .s{right:5px}
.hint{text-align:center;color:var(--mut);font-size:12.5px;margin:4px 0 12px}
.sk{height:300px;border-radius:22px;margin-bottom:18px;background:rgba(255,255,255,.09);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.5}}
.empty{text-align:center;color:var(--mut);padding:44px 10px;line-height:1.9}
.empty b{display:block;font-size:42px;margin-bottom:6px}
.empty .btn{width:auto;display:inline-flex;padding:10px 22px;margin-top:12px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(15,35,50,.96);border:1px solid var(--line);padding:11px 18px;border-radius:14px;z-index:30;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="grain"></div><div id="fl"></div></div>
<header>
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div><h1 id="brand">Vidox</h1></div>
  <div class="search" id="sbox"><span>🔎</span><input id="q" type="search" autocomplete="off"></div>
</header>
<div id="app"><div class="sk"></div><div class="sk"></div></div>
<script>
let tg=null,INIT='';let ST={lang:'ar',channels:[]};
const T={ar:{search:'ابحث عن قناة...',note:'💾 المحتوى مفتوح للحفظ والتحويل · لا استرداد بعد الشراء',buy:'اشترِ الآن',content:'🎞 استعرض المحتوى',open:'فتح القناة',members:'عضو',items:'محتوى',empty:'لا توجد قنوات حالياً',nores:'لا نتائج',preparing:'رابط الدفع قيد التجهيز، حاول بعد قليل.',err:'تعذر التحميل',retry:'إعادة المحاولة',noitems:'لم يُضف محتوى للمعاينة بعد',trust:'🛡 دليل الثقة',free:'مجانية',paid:'تم الدفع ✅ سيصلك رابط الدخول في البوت خلال ثوانٍ',cancel:'أُلغي الدفع',fail:'فشل الدفع',own:'✓ تملكها',hot:'🔥 رائجة',frombot:'افتح التطبيق من داخل البوت',gal:'معاينة المحتوى · للعرض فقط',more:'عرض المزيد',tap:'اضغط لفتح القناة'},
en:{search:'Search channels...',note:'💾 Content is open to save · no refunds after purchase',buy:'Buy now',content:'🎞 Browse content',open:'Open channel',members:'members',items:'items',empty:'No channels yet',nores:'No results',preparing:'Payment link is being prepared, try again shortly.',err:'Failed to load',retry:'Retry',noitems:'No preview content yet',trust:'🛡 Trust proof',free:'Free',paid:'Paid ✅ your join link is on its way in the bot',cancel:'Payment cancelled',fail:'Payment failed',own:'✓ Owned',hot:'🔥 Trending',frombot:'Open the app from inside the bot',gal:'Content preview · view only',more:'Show more',tap:'Tap to open the channel'}};
const tr=k=>(T[ST.lang]||T.ar)[k];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hap=(t='light')=>{try{tg.HapticFeedback.impactOccurred(t)}catch(e){}};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
async function api(p,b={}){try{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:INIT,...b})});return await r.json()}catch(e){return{ok:false,error:'network'}}}
const fdur=s=>{s=+s||0;const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const fsize=n=>{n=+n||0;return n>=1<<30?(n/(1<<30)).toFixed(1)+' GB':n>=1<<20?Math.round(n/(1<<20))+' MB':n?Math.max(1,Math.round(n/1024))+' KB':''};
function getInit(){
  try{const t=window.Telegram&&window.Telegram.WebApp;if(t){tg=t;if(t.initData)return t.initData}}catch(e){}
  try{const h=new URLSearchParams(location.hash.slice(1)).get('tgWebAppData');if(h)return h}catch(e){}
  try{return sessionStorage.getItem('vx_init')||''}catch(e){return ''}
}
async function waitInit(){for(let i=0;i<30;i++){const d=getInit();if(d){try{sessionStorage.setItem('vx_init',d)}catch(e){}return d}await new Promise(r=>setTimeout(r,150))}return ''}
function bgIcons(){const ic=['<svg width="@" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="14" height="12" rx="3"/><path d="M17 10l4-2v8l-4-2z"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h16M4 16h16M9 3v18M15 3v18"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>','<svg width="@" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-6 9 6-9 6zM7 13v4c0 1.5 9 1.5 10 0v-4"/></svg>'];
const box=$('#fl');for(let i=0;i<9;i++){const d=document.createElement('div');d.className='fl';const sz=18+Math.random()*26;d.innerHTML=ic[i%ic.length].replace('@',sz|0);d.style.left=(4+Math.random()*90)+'%';d.style.animationDuration=(18+Math.random()*14)+'s';d.style.animationDelay=(-Math.random()*20)+'s';d.style.setProperty('--o',(.12+Math.random()*.1).toFixed(2));d.style.setProperty('--r',((Math.random()*70-35)|0)+'deg');box.appendChild(d)}}
function link(u){if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank')}
function openOwned(c){hap('medium');if(c.link)link(c.link)}
async function buy(c){hap('medium');if(c.invoice)return pay(c.invoice);const r=await api('buy',{id:c.id});if(r.ok&&r.invoice)return pay(r.invoice);toast(r.error==='preparing'?tr('preparing'):tr('err'))}
function pay(url){if(!tg||!tg.openInvoice){link(url);return}tg.openInvoice(url,st=>{if(st==='paid'){try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}toast(tr('paid'));setTimeout(()=>tg.close(),2600)}else if(st==='cancelled')toast(tr('cancel'));else if(st==='failed')toast(tr('fail'))})}
function fail(code){tg&&tg.BackButton.hide();$('#app').innerHTML=`<div class="empty"><b>${code==='banned'?'🚫':code==='maintenance'?'🛠':'⚠️'}</b>${!INIT?tr('frombot'):tr('err')}<br><small>${esc(code||'')}</small><br><button class="btn" id="rt">${tr('retry')}</button></div>`;$('#rt').onclick=()=>boot()}
function card(c,i){return `<div class="card" data-id="${c.id}" style="animation-delay:${Math.min(i,5)*60}ms">
 <div class="cover">${c.cover?`<img loading="lazy" decoding="async" src="/img/c/${c.id}.jpg" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'nocover',textContent:'🎬'}))">`:'<div class="nocover">🎬</div>'}
 ${c.owned?`<span class="badge o">${tr('own')}</span>`:c.hot?`<span class="badge">${tr('hot')}</span>`:''}
 ${c.owned?'':`<button class="bubble" data-buy="${c.id}">${tr('buy')} · ${c.price} ⭐</button>`}
 <div class="ttl">${esc(c.name)}</div></div>
 <div class="body">${c.desc?`<p class="desc">${esc(c.desc)}</p>`:''}
 <div class="meta"><span class="chip">🎞 ${c.count} ${tr('items')}</span><span class="chip">👥 ${c.members} ${tr('members')}</span><span class="chip p">${c.price>0?c.price+' ⭐':tr('free')}</span></div>
 <button class="btn" data-view="${c.id}">${tr('content')}</button></div></div>`}
function renderList(){
  tg&&tg.BackButton.hide();$('#sbox').style.display='';const f=($('#q').value||'').trim().toLowerCase();
  const list=ST.channels.filter(c=>!f||(c.name+' '+c.title).toLowerCase().includes(f));
  const el=$('#app');
  if(!ST.channels.length){el.innerHTML=`<div class="empty"><b>🎬</b>${tr('empty')}</div>`;return}
  el.innerHTML=`<div class="note">${tr('note')}</div><div id="list">`+(list.length?list.map(card).join(''):`<div class="empty"><b>🔎</b>${tr('nores')}</div>`)+`</div>`+(ST.trust?`<button class="btn sec" id="trust">${tr('trust')}</button>`:'');
  const lst=$('#list');
  lst.onclick=e=>{const b=e.target.closest('[data-buy]');if(b){e.stopPropagation();return buy(ST.channels.find(c=>c.id==b.dataset.buy))}const v=e.target.closest('[data-view]');if(v)return showChannel(+v.dataset.view);const cd=e.target.closest('.card');if(cd){const c=ST.channels.find(x=>x.id==cd.dataset.id);if(c&&c.owned)openOwned(c)}};
  const t=$('#trust');if(t)t.onclick=()=>{hap();link(ST.trust)}
}
const PAGE=60;
async function showChannel(id){
  const c=ST.channels.find(x=>x.id==id);if(!c)return;hap();
  tg&&tg.BackButton.show();$('#sbox').style.display='none';window.scrollTo({top:0});
  $('#app').innerHTML='<div class="sk" style="height:120px"></div><div class="sk" style="height:120px"></div>';
  const r=await api('channel',{id});const m=(r.ok&&r.media)||[];let shown=0;
  const item=v=>`<div class="th"><img loading="lazy" decoding="async" src="/img/v/${v.id}.jpg" onerror="this.remove()"><div class="play"><i><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></i></div><span class="d">${fdur(v.duration)}</span><span class="s">${fsize(v.size)}</span></div>`;
  $('#app').innerHTML=`<div class="hint">${esc(c.name)} · ${tr('gal')}</div>`+(m.length?`<div class="gal" id="gal"></div><button class="btn more" id="more"></button>`:`<div class="empty"><b>🎞</b>${tr('noitems')}</div>`)+
  (c.owned?`<button class="cta open" id="act">${tr('open')}</button>`:`<button class="cta" id="act">${tr('buy')} · ${c.price} ⭐</button>`);
  const more=()=>{const g=$('#gal');if(!g)return;g.insertAdjacentHTML('beforeend',m.slice(shown,shown+PAGE).map(item).join(''));shown+=PAGE;const b=$('#more');if(shown>=m.length)b.style.display='none';else b.textContent=tr('more')+' ('+(m.length-shown)+')'};
  if(m.length){more();$('#more').onclick=more}
  $('#act').onclick=()=>c.owned?openOwned(c):buy(c)
}
$('#q').addEventListener('input',()=>renderList());
async function boot(){
  $('#app').innerHTML='<div class="sk"></div><div class="sk"></div>';
  INIT=await waitInit();
  if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#1c3d52');tg.setBackgroundColor('#1c3d52');tg.BackButton.onClick(()=>{hap();renderList()})}catch(e){}}
  if(!INIT){fail('no_init');return}
  let r=await api('init');
  if(!r.ok&&(r.error==='network'||r.error==='server'||r.error==='unauthorized')){await new Promise(x=>setTimeout(x,900));try{sessionStorage.removeItem('vx_init')}catch(e){}INIT=getInit()||INIT;r=await api('init')}
  if(!r.ok){fail(r.error);return}
  ST=r;document.documentElement.lang=r.lang;document.documentElement.dir=r.lang==='ar'?'rtl':'ltr';
  if(r.brand){document.title=r.brand;$('#brand').textContent=r.brand}
  $('#q').placeholder=tr('search');renderList();
  const q=new URLSearchParams(location.search).get('c');if(q&&ST.channels.find(c=>c.id==q))showChannel(+q)
}
bgIcons();boot();
</script>
</body>
</html>
